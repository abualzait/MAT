<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدخول | محافظة العاصمة — MAT — حقيبة الأدوات المساعدة</title>
    <!-- Google Fonts - IBM Plex Sans Arabic & Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Civic Horizon CSS Design System -->
    <link rel="stylesheet" href="/complaints/css/design-system.css">
    <style>
        body {
            font-family: 'IBM Plex Sans Arabic', 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0D2E58 0%, #001939 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            width: 100%;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: var(--radius-2xl);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2.5rem 2rem;
            max-width: 440px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(16px);
        }
        .login-logo-large {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: 0 auto 1.25rem auto;
        }
        .login-logo-large img {
            width: 140px;
            max-width: 80%;
            height: auto;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 6px 14px rgba(13, 46, 88, 0.18));
            transition: transform 0.3s ease;
        }
        .login-logo-large img:hover {
            transform: scale(1.03);
        }
        .login-card h2 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent-primary);
            margin-bottom: 0.25rem;
        }
        .login-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 1.75rem;
        }
        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #D1FAE5;
            color: #065F46;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 1.25rem;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <style>
            .avatar-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
                gap: 12px;
                margin-bottom: 2rem;
                direction: rtl;
            }
            .avatar-btn {
                background: white;
                border: 2px solid var(--border-color);
                border-radius: var(--radius-lg);
                padding: 12px 5px;
                cursor: pointer;
                transition: all 0.2s ease;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }
            .avatar-btn:hover, .avatar-btn.selected {
                border-color: var(--accent-primary);
                background: #F0F7FF;
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(13, 46, 88, 0.1);
            }
            .avatar-circle {
                width: 50px;
                height: 50px;
                border-radius: 50%;
                background: #E2E8F0;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 20px;
                color: var(--accent-primary);
                font-weight: 800;
            }
            .avatar-btn.selected .avatar-circle {
                background: var(--accent-primary);
                color: white;
            }
            .avatar-name {
                font-size: 0.9rem;
                font-weight: 700;
                color: var(--text-primary);
            }
            .avatar-role {
                font-size: 0.7rem;
                color: var(--text-secondary);
            }
            .secret-input-wrapper {
                margin-bottom: 1.5rem;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }
            .secret-input {
                border: 1px solid var(--border-color);
                border-radius: var(--radius-md);
                background: #f8fafc;
                width: 100%;
                max-width: 200px;
                height: 40px;
                padding: 0 12px;
                outline: none;
                text-align: center;
                font-family: monospace;
                letter-spacing: 2px;
                transition: all 0.2s ease;
            }
            .secret-input:focus {
                border-color: var(--accent-primary);
                box-shadow: 0 0 0 3px rgba(13, 46, 88, 0.1);
            }
            .secret-label {
                font-size: 0.8rem;
                color: var(--text-muted);
                font-weight: 600;
            }
        </style>

        <div class="login-card">
            <div class="login-logo-large">
                <img src="/amman_logo.png" alt="شعار المحافظة" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Coat_of_arms_of_Jordan.svg/500px-Coat_of_arms_of_Jordan.svg.png'">
            </div>

            <h2>حقيبة الأدوات المساعدة (MAT)</h2>
            <p class="login-subtitle">يرجى اختيار المستخدم للدخول إلى النظام</p>

            <form id="loginForm" onsubmit="handleLogin(event)">

                <div class="avatar-grid" id="avatarGrid">
                    <!-- Orwa -->
                    <button type="button" class="avatar-btn" onclick="selectUser('orwa', this)">
                        <div class="avatar-circle">ع</div>
                        <span class="avatar-name">عروة</span>
                        <span class="avatar-role">رئيس قسم</span>
                    </button>
                    <!-- Ehab -->
                    <button type="button" class="avatar-btn" onclick="selectUser('ehab', this)">
                        <div class="avatar-circle">إ</div>
                        <span class="avatar-name">ايهاب</span>
                        <span class="avatar-role">ضابط شكاوي</span>
                    </button>
                    <!-- Sultan -->
                    <button type="button" class="avatar-btn" onclick="selectUser('sultan', this)">
                        <div class="avatar-circle">س</div>
                        <span class="avatar-name">سلطان</span>
                        <span class="avatar-role">ضابط شكاوي</span>
                    </button>
                    <!-- Abualzait -->
                    <button type="button" class="avatar-btn" onclick="selectUser('abualzait', this)">
                        <div class="avatar-circle">أ</div>
                        <span class="avatar-name">ابوالزيت</span>
                        <span class="avatar-role">ضابط شكاوي</span>
                    </button>
                    <!-- Raad -->
                    <button type="button" class="avatar-btn" onclick="selectUser('raad', this)">
                        <div class="avatar-circle">ر</div>
                        <span class="avatar-name">رعد</span>
                        <span class="avatar-role">ضابط اتصال</span>
                    </button>
                </div>

                <div class="secret-input-wrapper" style="margin-top: 1rem;">
                    <label class="secret-label" for="secretCode">كود النظام (اختياري)</label>
                    <input type="password" id="secretCode" class="secret-input" autocomplete="off" placeholder="•••">
                </div>

                <input type="hidden" id="selectedUsername" value="" required>

                <div id="loginError" class="form-error mb-2"></div>
            </form>

            <div style="margin-top: 2rem; font-size: 0.8rem; color: var(--text-muted); text-align: center; border-top: 1px solid var(--border-color); padding-top: 1rem;">
                <p style="font-weight: 700; color: var(--accent-primary);">المملكة الأردنية الهاشمية — وزارة الداخلية</p>
                <p style="margin-top: 0.25rem;">MAT (Modular Assistant Toolkit) — حقيبة الأدوات المساعدة — الإصدار 1.17.0</p>
            </div>
        </div>
    </div>

    <script>
        function selectUser(username, btnEl) {
            document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('selected'));
            btnEl.classList.add('selected');
            document.getElementById('selectedUsername').value = username;
            
            // Auto login when an avatar is clicked
            handleLogin(new Event('submit'));
        }

        async function handleLogin(e) {
            if (e) e.preventDefault();
            const errorDiv = document.getElementById('loginError');
            const username = document.getElementById('selectedUsername').value;
            const secret_code = document.getElementById('secretCode').value;
            const activeAvatar = document.querySelector('.avatar-btn.selected');

            if (!username) {
                errorDiv.textContent = 'يرجى اختيار المستخدم';
                errorDiv.classList.add('show');
                return;
            }

            errorDiv.classList.remove('show');
            
            // Show loading state on avatar
            if (activeAvatar) {
                activeAvatar.style.opacity = '0.6';
                activeAvatar.style.pointerEvents = 'none';
            }

            try {
                const res = await fetch('/api/v1/mat/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, secret_code })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    if (data.admin_mode) {
                        localStorage.setItem('adminModeActive', 'true');
                    } else {
                        localStorage.removeItem('adminModeActive');
                    }
                    window.location.href = '/';
                } else {
                    errorDiv.textContent = data.error || 'فشل تسجيل الدخول';
                    errorDiv.classList.add('show');
                    document.getElementById('secretCode').value = '';
                    if (activeAvatar) {
                        activeAvatar.style.opacity = '1';
                        activeAvatar.style.pointerEvents = 'auto';
                        activeAvatar.classList.remove('selected');
                    }
                }
            } catch (err) {
                errorDiv.textContent = 'تعذر الاتصال بالخادم المحلي';
                errorDiv.classList.add('show');
                if (activeAvatar) {
                    activeAvatar.style.opacity = '1';
                    activeAvatar.style.pointerEvents = 'auto';
                    activeAvatar.classList.remove('selected');
                }
            }
        }
    </script>
</body>
</html>
