name: mat-toolkit
type: service
git:
  repository: github.com/abualzait/MAT
  branch: main
build:
  type: docker
  dockerfile: Dockerfile
ports:
  - port: 8080
    path: /
routes:
  - path: /
    port: 8080
env:
  - key: MAT_ENV
    value: production
  - key: PORT
    value: "8080"
  - key: MAT_HOST
    value: "0.0.0.0"
  - key: MAT_SECRET_KEY
    value: mat_secret_key_2026_prod
regions:
  - fra
